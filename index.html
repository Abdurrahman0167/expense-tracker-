<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>мои расходы</title>
</head>
<body>
    <div class="container">
        <section class="tracker">
            <header class="tracker__header">
                <img  class="tracker__logo" src="img/wallet.svg" alt="иконка кошелька">
                <h1 class="tracker__title">трекер расходов</h1>
            </header>
            <main tracker__main>
                <div class="balance">
                    <p class="balance__label">баланс</p>
                    <p class="balance__sum"></p>
                </section>
    
                <section class="stat-summary">
                    <div class="stat__flex">
                        <div class="stat-item stat-item_income">
                            <div class="stat-item__icon stat-item__icon_dir_up"><p>↑</p></div>
                            <div class="stat__text-container">
                                <p class="stat-item__label">доходы</p>
                                <p class="stat-item__value"></p>
                            </div>
                        </div>

                        <div class="line"></div>

                        <div class="stat-item stat-item_expense">
                            <div class="stat-item__icon stat-item__icon_dir_down"><p>↓</p></div>
                            <div class="stat__text-container">
                                <p class="stat-item__label">расходы</p>
                                <p class="stat-item__value"></p>
                            </div>
                        </div>
                    </div>
    
                        <form action="#" class="transaction-form">
                           <div class=" transition-container transition-container__name">
                            <label>
                                    <img class="transaction-img" src="img/wallet.svg" alt="">
                                <input class="transition-form__name" type="text" placeholder="название опирации">
                            </label>
                             
                            </div>
                            <div class="transition-container transition-container_flex">

                               <div class="transition-container__summ">  
                                <label class="transition-rub">
                                    ₽ 
                                    <input class="transition-form__summ" type="number"placeholder="сумма">
                                </label>
                                </div>
                                <select class="transition-form__select">
                            </div>
                                <option value="">⇄ Доход</option>
                                <option value="">⇄ Расход</option>
                            </select>
                            <button class="transition-form__submit" type="submit"><p class="sumbmit-text">+</p></button>
                        </form>
                    </section>
    
                <section class="history">
                    <h2 class="history__title">история</h2>
                </section>
            </main>
        </div>
    </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
